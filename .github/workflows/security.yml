name: Security & Rules Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-checks:
    name: Firestore Security Rules & Static Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Firestore security rules
        run: npx eslint firestore.rules

      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high || true
